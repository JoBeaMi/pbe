project:
  type: book
  output-dir: _book

lang: pt-PT

# Os blocos de R são executados no RStudio e o resultado fica guardado em _freeze/
# (que vai com o push). O GitHub Actions só monta o site; não precisa de R.
execute:
  freeze: auto

book:
  title: "E agora? O que fazemos com a evidência?"
  subtitle: "Da pergunta clínica à decisão partilhada"
  description: "Prática baseada na evidência, com exemplos de terapia da fala e neurodesenvolvimento. Um livro em construção, de Joana Miguel."
  author:
    - name: Joana Miguel
      email: joana.miguel@caidi.pt
  date: today
  date-format: "D MMMM YYYY"
  license: CC BY-NC-SA
  site-url: https://joanamiguel.pt/pbe/
  repo-url: https://github.com/JoBeaMi/pbe
  repo-branch: main
  reader-mode: true
  sidebar:
    title: E agora?<br>O que fazemos com a evidência?
    subtitle: Joana Miguel, em construção
    tools:
      - icon: envelope
        href: mailto:joana.miguel@caidi.pt
  page-footer:
    background: light
    left: Joana Miguel
    center: E agora? O que fazemos com a evidência?
    right: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt">CC BY-NC-SA</a>
  chapters:
    - index.qmd
    - como-usar.qmd
    # Parte I. Ler números (cada capítulo entra depois da aula correspondente)
    - part: "Ler números"
      chapters:
        - 01-ler-um-resultado.qmd
        - 02-descrever-e-desconfiar.qmd
        - 03-o-valor-p.qmd
    # Parte II. Do problema ao protocolo
    # - part: "Do problema ao protocolo"
    #   chapters:
    #     - 04-da-duvida-a-pergunta.qmd
    #     - 05-etica-e-tipos-de-estudo.qmd
    #     - 06-pbe-e-analise-critica.qmd
    #     - 07-revisao-sistematica.qmd
    # Parte III. Da evidência à decisão (prometida no prefácio; escreve-se quando chegar lá)
    # - part: "Da evidência à decisão"
    #   chapters:
    #     - 08-aplicar-a-este-utente.qmd
    #     - 09-decidir-com-o-utente.qmd
    #     - 10-quando-nao-ha-evidencia.qmd
    - part: "Percursos"
      chapters:
        - percursos/mptf-ii-2026.qmd
    - bibliografia.qmd
    - referencias.qmd
  appendices:
    - glossario.qmd

bibliography: referencias.bib
csl: apa.csl

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    include-in-header:
      - text: '<script src="quiz.js"></script>'
    toc: true
    toc-depth: 3
    number-sections: true
    link-external-newwindow: true
    footnotes-hover: true
    lightbox: true
